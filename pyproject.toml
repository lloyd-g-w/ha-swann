[project]
name = "ha-swann"
version = "0.1.0"
description = "Home Assistant custom integration for Swann NVRs (RaySharp firmware)"
requires-python = ">=3.14.2"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "D"]
ignore = ["D203", "D213", "PLR0913", "PLR2004", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR"]
"script/**" = ["D"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
